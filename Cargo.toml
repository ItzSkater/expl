[package]
name = "expl"
version = "0.1.0"
edition = "2021"
description = "A universal Linux package manager for AppImage packages"
license = "GPL-3.0"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
indicatif = "0.17"   # прогресс бар
rand = "0.8"
futures-util = "0.3"
